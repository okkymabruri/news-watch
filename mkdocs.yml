# The GitHub Pages mirror of these docs is RETIRED as of 2026-08-01.
# The Deploy Docs workflow is disabled and the gh-pages branch is deleted.
#
# Do NOT run `mkdocs gh-deploy`. It pushes gh-pages directly, bypassing the
# disabled workflow, and Pages would resume serving a second, stale copy at
# okkymabruri.github.io. Use `mkdocs build` for local preview.
#
# These docs ship from okky.dev, which pulls docs/ from this repo at each
# release. Publish a release and the site picks it up; nothing here deploys.

site_name: news-watch
site_description: Scrape structured news data from Indonesia's top news websites.
site_url: https://okkymabruri.github.io/news-watch
repo_url: https://github.com/okkymabruri/news-watch
repo_name: okkymabruri/news-watch

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Practical Guide: practical-guide.md
  - Use Case MBG: use-case-mbg.md
  - API Reference: api-reference.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  homepage: https://okky.dev
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/okkymabruri/news-watch
